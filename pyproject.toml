[project]
name = "gatekeeper"
version = "0.1.0"
description = "Policy-governed RAG over versioned Next.js docs: three fast decision gates."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "google-genai>=3.2",
    "bm25s>=0.2.13",
    "numpy>=2.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a live model; skipped unless GEMINI_API_KEY is set"]
